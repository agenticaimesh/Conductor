name = "conductor"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Create a NEW KV namespace for Conductor (Cloudflare dashboard -> Workers & Pages -> KV -> Create) and paste its id below.
[[kv_namespaces]]
binding = "CONDUCTOR"
id = "PASTE-NEW-KV-NAMESPACE-ID-HERE"

[triggers]
crons = ["*/5 * * * *"]
